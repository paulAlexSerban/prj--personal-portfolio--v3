name: Deploy TEST (AWS S3 + CloudFront)

on:
    workflow_dispatch:

concurrency:
    group: deploy-test
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build-site:
        uses: ./.github/workflows/_build-site.yaml
        with:
            environment: test
            site_url: https://test.paulserban.eu
        secrets: inherit

    deploy-test:
        needs: build-site
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: test
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download site bundle
              uses: actions/download-artifact@v8
              with:
                  name: site-bundle
                  path: _site/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync to S3
              run: aws s3 sync _site/ "s3://${{ vars.S3_BUCKET_NAME }}" --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/*"
