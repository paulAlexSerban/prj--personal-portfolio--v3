name: Deploy TEST (AWS S3 + CloudFront)

on:
    workflow_dispatch:
        inputs:
            portfolio:
                description: Build and deploy portfolio-site
                type: boolean
                default: true
            blog:
                description: Build and deploy blog-site
                type: boolean
                default: true
            quiz:
                description: Build and deploy quiz-web-app
                type: boolean
                default: true
            news:
                description: Build and deploy news-feed-site
                type: boolean
                default: true

concurrency:
    group: deploy-test
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build-site:
        uses: ./.github/workflows/_build-site.yaml
        with:
            environment: test
            portfolio_url: https://test.paulserban.eu
            blog_url: https://test.blog.paulserban.eu
            quiz_url: https://test.quiz.paulserban.eu
            news_url: https://test.news-feed.paulserban.eu
            portfolio_base: /
            blog_base: /
            quiz_base: /
            news_base: /
            emit_merged_bundle: false
            content_source: test
            s3_deploy: true
            portfolio: ${{ inputs.portfolio }}
            blog: ${{ inputs.blog }}
            quiz: ${{ inputs.quiz }}
            news: ${{ inputs.news }}
        secrets: inherit
        permissions:
            contents: read
            id-token: write
