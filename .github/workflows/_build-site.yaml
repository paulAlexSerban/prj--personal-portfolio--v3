name: Build site bundle

on:
    workflow_call:
        inputs:
            environment:
                description: Target environment name (stage, production, etc.)
                required: true
                type: string
            portfolio_url:
                description: Absolute origin for portfolio-site (e.g. https://test.paulserban.eu). Empty until hosting is configured.
                required: false
                type: string
                default: ''
            blog_url:
                description: Absolute origin for blog-site
                required: false
                type: string
                default: ''
            quiz_url:
                description: Absolute origin for quiz-web-app
                required: false
                type: string
                default: ''
            news_url:
                description: Absolute origin for news-feed-site
                required: false
                type: string
                default: ''
            portfolio_base:
                description: URL base path for portfolio-site
                required: false
                type: string
                default: /home
            blog_base:
                description: URL base path for blog-site
                required: false
                type: string
                default: /blog
            quiz_base:
                description: URL base path for quiz-web-app
                required: false
                type: string
                default: /quiz
            news_base:
                description: URL base path for news-feed-site
                required: false
                type: string
                default: /news
            emit_merged_bundle:
                description: If true, merge per-app dists into a single site-bundle artifact (GitHub Pages / release). Set false for per-domain S3 deploys.
                required: false
                type: boolean
                default: true
            artifact_retention_days:
                description: Retention for the merged site-bundle artifact
                required: false
                type: number
                default: 14
            content_source:
                description: Which content tree to ingest - 'live' (clone private content repo) or 'test' (committed fixtures under content/test)
                required: false
                type: string
                default: live
            ref:
                description: Git ref/SHA to checkout (e.g. workflow_run.head_sha). Defaults to the caller commit.
                required: false
                type: string
                default: ''
            cf_beacon_token_portfolio:
                description: Cloudflare Web Analytics token for portfolio-site. Pass only on production; leave empty elsewhere.
                required: false
                type: string
                default: ''
            cf_beacon_token_blog:
                description: Cloudflare Web Analytics token for blog-site. Pass only on production; leave empty elsewhere.
                required: false
                type: string
                default: ''
            cf_beacon_token_news:
                description: Cloudflare Web Analytics token for news-feed-site. Pass only on production; leave empty elsewhere.
                required: false
                type: string
                default: ''
            cf_beacon_token_quiz:
                description: Cloudflare Web Analytics token for quiz-web-app. Pass only on production; leave empty elsewhere.
                required: false
                type: string
                default: ''
            s3_deploy:
                description: If true, sync each selected app's dist to S3 and invalidate CloudFront after that app builds. Leave false for GitHub Pages.
                required: false
                type: boolean
                default: false
            portfolio:
                description: Build (and S3-deploy if s3_deploy) portfolio-site
                required: false
                type: boolean
                default: true
            blog:
                description: Build (and S3-deploy if s3_deploy) blog-site
                required: false
                type: boolean
                default: true
            quiz:
                description: Build (and S3-deploy if s3_deploy) quiz-web-app
                required: false
                type: boolean
                default: true
            news:
                description: Build (and S3-deploy if s3_deploy) news-feed-site
                required: false
                type: boolean
                default: true

env:
    DATABASE_PATH: ${{ github.workspace }}/database/output/content.db
    QUIZ_DATA_OUT: ${{ github.workspace }}/frontend/apps/quiz-web-app/public/data

jobs:
    ingest-content:
        if: ${{ inputs.emit_merged_bundle || inputs.portfolio || inputs.blog || inputs.quiz }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: ./.github/actions/setup-monorepo
            - run: pnpm db:migrate

            - name: Sync live content
              if: inputs.content_source == 'live'
              env:
                  GITHUB_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
                  CONTENT_REPO_GIT_URL: https://github.com/paulAlexSerban/content--paulserban.eu.git
              run: pnpm --filter @prj--personal-portfolio--v3/tools--content-sync start

            - name: Ingest content
              env:
                  CONTENT_DIR: ${{ github.workspace }}/content/${{ inputs.content_source }}/content/publish
              run: |
                  pnpm --filter @prj--personal-portfolio--v3/tools--mdx-ingest start
                  pnpm --filter @prj--personal-portfolio--v3/tools--json-ingest start
                  pnpm --filter @prj--personal-portfolio--v3/tools--quiz-export start

            - name: Upload content DB
              uses: actions/upload-artifact@v7
              with:
                  name: content-db-${{ inputs.environment }}
                  path: database/output/content.db
                  if-no-files-found: error
                  retention-days: 1

            - name: Upload quiz data
              uses: actions/upload-artifact@v7
              with:
                  name: quiz-data-${{ inputs.environment }}
                  path: frontend/apps/quiz-web-app/public/data/
                  if-no-files-found: error
                  retention-days: 1

    build-portfolio:
        if: ${{ inputs.portfolio }}
        needs: ingest-content
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: ./.github/actions/setup-monorepo

            - name: Download content DB
              uses: actions/download-artifact@v8
              with:
                  name: content-db-${{ inputs.environment }}
                  path: database/output/

            - name: Build portfolio-site
              env:
                  ASTRO_SITE: ${{ inputs.portfolio_url }}
                  ASTRO_BASE: ${{ inputs.portfolio_base }}
                  DATABASE_PATH: ${{ github.workspace }}/database/output/content.db
                  PUBLIC_CF_BEACON_TOKEN: ${{ inputs.environment == 'production' && inputs.cf_beacon_token_portfolio || '' }}
              run: |
                  [ -n "${{ inputs.blog_url }}" ] && export PUBLIC_BLOG_URL="${{ inputs.blog_url }}${{ inputs.blog_base }}"
                  [ -n "${{ inputs.quiz_url }}" ] && export PUBLIC_QUIZ_URL="${{ inputs.quiz_url }}${{ inputs.quiz_base }}"
                  [ -n "${{ inputs.news_url }}" ] && export PUBLIC_NEWS_URL="${{ inputs.news_url }}${{ inputs.news_base }}"
                  pnpm --filter @prj--personal-portfolio--v3/frontend--portfolio-site build

            - name: Upload portfolio artifact
              uses: actions/upload-artifact@v7
              with:
                  name: portfolio-dist-${{ inputs.environment }}
                  path: frontend/sites/portfolio-site/dist/
                  if-no-files-found: error
                  retention-days: 1

    build-blog:
        if: ${{ inputs.blog }}
        needs: ingest-content
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: ./.github/actions/setup-monorepo

            - name: Download content DB
              uses: actions/download-artifact@v8
              with:
                  name: content-db-${{ inputs.environment }}
                  path: database/output/

            - name: Build blog-site
              env:
                  ASTRO_SITE: ${{ inputs.blog_url }}
                  ASTRO_BASE: ${{ inputs.blog_base }}
                  DATABASE_PATH: ${{ github.workspace }}/database/output/content.db
                  PUBLIC_CF_BEACON_TOKEN: ${{ inputs.environment == 'production' && inputs.cf_beacon_token_blog || '' }}
              run: |
                  [ -n "${{ inputs.portfolio_url }}" ] && export PUBLIC_PORTFOLIO_URL="${{ inputs.portfolio_url }}${{ inputs.portfolio_base }}"
                  [ -n "${{ inputs.quiz_url }}" ] && export PUBLIC_QUIZ_URL="${{ inputs.quiz_url }}${{ inputs.quiz_base }}"
                  [ -n "${{ inputs.news_url }}" ] && export PUBLIC_NEWS_URL="${{ inputs.news_url }}${{ inputs.news_base }}"
                  pnpm --filter @prj--personal-portfolio--v3/frontend--blog-site build

            - name: Upload blog artifact
              uses: actions/upload-artifact@v7
              with:
                  name: blog-dist-${{ inputs.environment }}
                  path: frontend/sites/blog-site/dist/
                  if-no-files-found: error
                  retention-days: 1

    build-quiz:
        if: ${{ inputs.quiz }}
        needs: ingest-content
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: ./.github/actions/setup-monorepo

            - name: Download quiz data
              uses: actions/download-artifact@v8
              with:
                  name: quiz-data-${{ inputs.environment }}
                  path: frontend/apps/quiz-web-app/public/data/

            - name: Build quiz-web-app
              env:
                  VITE_APP_BASE: ${{ inputs.quiz_base }}
                  VITE_CF_BEACON_TOKEN: ${{ inputs.environment == 'production' && inputs.cf_beacon_token_quiz || '' }}
              run: |
                  [ -n "${{ inputs.portfolio_url }}" ] && export VITE_PORTFOLIO_URL="${{ inputs.portfolio_url }}${{ inputs.portfolio_base }}"
                  [ -n "${{ inputs.blog_url }}" ] && export VITE_BLOG_URL="${{ inputs.blog_url }}${{ inputs.blog_base }}"
                  [ -n "${{ inputs.news_url }}" ] && export VITE_NEWS_URL="${{ inputs.news_url }}${{ inputs.news_base }}"
                  pnpm --filter @prj--personal-portfolio--v3/frontend--quiz-web-app build

            - name: Upload quiz artifact
              uses: actions/upload-artifact@v7
              with:
                  name: quiz-dist-${{ inputs.environment }}
                  path: frontend/apps/quiz-web-app/dist/
                  if-no-files-found: error
                  retention-days: 1

    build-news:
        if: ${{ inputs.news }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.sha }}
            - uses: ./.github/actions/setup-monorepo

            - name: Build news-feed-site
              env:
                  ASTRO_SITE: ${{ inputs.news_url }}
                  ASTRO_BASE: ${{ inputs.news_base }}
                  PUBLIC_NEWS_DATA_URL: https://news-data.paulserban.eu
                  PUBLIC_CF_BEACON_TOKEN: ${{ inputs.environment == 'production' && inputs.cf_beacon_token_news || '' }}
              run: |
                  [ -n "${{ inputs.portfolio_url }}" ] && export PUBLIC_PORTFOLIO_URL="${{ inputs.portfolio_url }}${{ inputs.portfolio_base }}"
                  [ -n "${{ inputs.blog_url }}" ] && export PUBLIC_BLOG_URL="${{ inputs.blog_url }}${{ inputs.blog_base }}"
                  [ -n "${{ inputs.quiz_url }}" ] && export PUBLIC_QUIZ_URL="${{ inputs.quiz_url }}${{ inputs.quiz_base }}"
                  pnpm --filter @prj--personal-portfolio--v3/frontend--news-feed-site build

            - name: Upload news artifact
              uses: actions/upload-artifact@v7
              with:
                  name: news-dist-${{ inputs.environment }}
                  path: frontend/sites/news-feed-site/dist/
                  if-no-files-found: error
                  retention-days: 1

    deploy-portfolio:
        if: ${{ inputs.s3_deploy && inputs.portfolio }}
        needs: build-portfolio
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download portfolio artifact
              uses: actions/download-artifact@v8
              with:
                  name: portfolio-dist-${{ inputs.environment }}
                  path: _site/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync to S3
              run: aws s3 sync _site/ "s3://${{ vars.PORTFOLIO_S3_BUCKET_NAME }}" --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.PORTFOLIO_CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/*"

    deploy-blog:
        if: ${{ inputs.s3_deploy && inputs.blog }}
        needs: build-blog
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download blog artifact
              uses: actions/download-artifact@v8
              with:
                  name: blog-dist-${{ inputs.environment }}
                  path: _site/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync to S3
              run: aws s3 sync _site/ "s3://${{ vars.BLOG_S3_BUCKET_NAME }}" --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.BLOG_CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/*"

    deploy-quiz:
        if: ${{ inputs.s3_deploy && inputs.quiz }}
        needs: build-quiz
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download quiz artifact
              uses: actions/download-artifact@v8
              with:
                  name: quiz-dist-${{ inputs.environment }}
                  path: _site/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync to S3
              run: aws s3 sync _site/ "s3://${{ vars.QUIZ_S3_BUCKET_NAME }}" --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.QUIZ_CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/*"

    deploy-news:
        if: ${{ inputs.s3_deploy && inputs.news }}
        needs: build-news
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download news artifact
              uses: actions/download-artifact@v8
              with:
                  name: news-dist-${{ inputs.environment }}
                  path: _site/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync to S3
              run: aws s3 sync _site/ "s3://${{ vars.NEWS_S3_BUCKET_NAME }}" --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.NEWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/*"

    merge:
        if: ${{ inputs.emit_merged_bundle }}
        needs: [build-portfolio, build-blog, build-quiz, build-news]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Download portfolio artifact
              uses: actions/download-artifact@v8
              with:
                  name: portfolio-dist-${{ inputs.environment }}
                  path: portfolio-dist/

            - name: Download blog artifact
              uses: actions/download-artifact@v8
              with:
                  name: blog-dist-${{ inputs.environment }}
                  path: blog-dist/

            - name: Download quiz artifact
              uses: actions/download-artifact@v8
              with:
                  name: quiz-dist-${{ inputs.environment }}
                  path: quiz-dist/

            - name: Download news artifact
              uses: actions/download-artifact@v8
              with:
                  name: news-dist-${{ inputs.environment }}
                  path: news-dist/

            - name: Merge outputs and scaffold navigation
              env:
                  PORTFOLIO_BASE: ${{ inputs.portfolio_base }}
                  BLOG_BASE: ${{ inputs.blog_base }}
                  QUIZ_BASE: ${{ inputs.quiz_base }}
                  NEWS_BASE: ${{ inputs.news_base }}
              run: |
                  mkdir -p _site/home _site/blog _site/quiz _site/news
                  cp -r portfolio-dist/. _site/home/
                  cp -r blog-dist/. _site/blog/
                  cp -r quiz-dist/. _site/quiz/
                  cp -r news-dist/. _site/news/

                  # Root -> portfolio redirect
                  printf '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=%s/"></head><body></body></html>\n' \
                    "$PORTFOLIO_BASE" > _site/index.html

                  # 404 router: quiz SPA deep-links, portfolio/blog/news styled 404 pages
                  cat > _site/404.html << EOF
                  <!DOCTYPE html>
                  <html>
                    <head>
                      <script>
                        (function(){
                          var l=window.location,p=l.pathname;
                          var quiz='${QUIZ_BASE}',blog='${BLOG_BASE}',home='${PORTFOLIO_BASE}',news='${NEWS_BASE}';
                          if(p.indexOf(quiz)===0){
                            sessionStorage.setItem('spa:redirect',l.pathname+l.search);l.replace(quiz+'/');return;}
                          if(p.indexOf(blog)===0){l.replace(blog+'/404.html');return;}
                          if(p.indexOf(news)===0){l.replace(news+'/404.html');return;}
                          if(p.indexOf(home)===0){l.replace(home+'/404.html');return;}
                        l.replace(home+'/404.html');})();
                      </script>
                    </head>
                    <body>Page not found.</body>
                  </html>
                  EOF

            - name: Upload site bundle
              uses: actions/upload-artifact@v7
              with:
                  name: site-bundle
                  path: _site/
                  if-no-files-found: error
                  retention-days: ${{ inputs.artifact_retention_days }}
