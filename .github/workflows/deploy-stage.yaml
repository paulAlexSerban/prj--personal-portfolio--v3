name: Deploy STAGE (AWS S3 + CloudFront)

on:
    workflow_dispatch:

concurrency:
    group: deploy-stage
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build-site:
        uses: ./.github/workflows/_build-site.yaml
        with:
            environment: stage
            portfolio_url: https://stage.paulserban.eu
            blog_url: https://stage.blog.paulserban.eu
            quiz_url: https://stage.quiz.paulserban.eu
            news_url: https://stage.news-feed.paulserban.eu
            portfolio_base: /
            blog_base: /
            quiz_base: /
            news_base: /
            emit_merged_bundle: false
            artifact_retention_days: 14
        secrets: inherit

    deploy:
        needs: build-site
        uses: ./.github/workflows/_deploy-s3.yaml
        with:
            environment: stage
        secrets: inherit
        permissions:
            contents: read
            id-token: write
