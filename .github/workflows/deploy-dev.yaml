name: Deploy DEV (GitHub Pages)

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - 'assets/**'
            - 'backend/**'
            - 'frontend/**'
            - 'shared/**'
            - 'tools/**'

concurrency:
    group: pages
    cancel-in-progress: false

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    resolve-pages:
        runs-on: ubuntu-latest
        outputs:
            origin: ${{ steps.pages.outputs.origin }}
            base_path: ${{ steps.pages.outputs.base_path }}
        steps:
            - name: Configure Pages
              id: pages
              uses: actions/configure-pages@v6

    build-site:
        needs: resolve-pages
        uses: ./.github/workflows/_build-site.yaml
        with:
            environment: dev
            portfolio_url: ${{ needs.resolve-pages.outputs.origin }}
            blog_url: ${{ needs.resolve-pages.outputs.origin }}
            quiz_url: ${{ needs.resolve-pages.outputs.origin }}
            news_url: ${{ needs.resolve-pages.outputs.origin }}
            portfolio_base: ${{ needs.resolve-pages.outputs.base_path }}/home
            blog_base: ${{ needs.resolve-pages.outputs.base_path }}/blog
            quiz_base: ${{ needs.resolve-pages.outputs.base_path }}/quiz
            news_base: ${{ needs.resolve-pages.outputs.base_path }}/news
            emit_merged_bundle: true
            content_source: live
        secrets: inherit

    deploy:
        needs: build-site
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Download site bundle
              uses: actions/download-artifact@v8
              with:
                  name: site-bundle
                  path: _site/

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site/

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
