name: Release

on:
    workflow_dispatch:

concurrency:
    group: release-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write

jobs:
    version:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            published: ${{ steps.changesets.outputs.published }}
            publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup monorepo
              uses: ./.github/actions/setup-monorepo

            - name: Create Version Packages PR or tag release
              id: changesets
              uses: changesets/action@v1
              with:
                  publish: npx @changesets/cli tag
                  commit: 'chore: version packages'
                  title: 'chore: version packages'
                  createGithubReleases: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-site:
        needs: version
        if: needs.version.outputs.published == 'true'
        uses: ./.github/workflows/_build-site.yaml
        with:
            environment: stage
            portfolio_url: https://stage.paulserban.eu
            blog_url: https://stage.blog.paulserban.eu
            quiz_url: https://stage.quiz.paulserban.eu
            news_url: https://stage.news-feed.paulserban.eu
            portfolio_base: /
            blog_base: /
            quiz_base: /
            news_base: /
            emit_merged_bundle: false
            artifact_retention_days: 14
        secrets: inherit

    deploy-stage-portfolio:
        needs: build-site
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: stage
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download portfolio artifact
              uses: actions/download-artifact@v8
              with:
                  name: portfolio-dist-stage
                  path: _site/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync to S3
              run: aws s3 sync _site/ "s3://${{ vars.PORTFOLIO_S3_BUCKET_NAME }}" --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.PORTFOLIO_CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/*"

    deploy-stage-blog:
        needs: build-site
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: stage
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download blog artifact
              uses: actions/download-artifact@v8
              with:
                  name: blog-dist-stage
                  path: _site/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync to S3
              run: aws s3 sync _site/ "s3://${{ vars.BLOG_S3_BUCKET_NAME }}" --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.BLOG_CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/*"

    deploy-stage-quiz:
        needs: build-site
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: stage
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download quiz artifact
              uses: actions/download-artifact@v8
              with:
                  name: quiz-dist-stage
                  path: _site/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync to S3
              run: aws s3 sync _site/ "s3://${{ vars.QUIZ_S3_BUCKET_NAME }}" --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.QUIZ_CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/*"

    deploy-stage-news:
        needs: build-site
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: stage
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download news artifact
              uses: actions/download-artifact@v8
              with:
                  name: news-dist-stage
                  path: _site/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync to S3
              run: aws s3 sync _site/ "s3://${{ vars.NEWS_S3_BUCKET_NAME }}" --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.NEWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/*"

    deploy-prod:
        needs:
            - deploy-stage-portfolio
            - deploy-stage-blog
            - deploy-stage-quiz
            - deploy-stage-news
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: production
        steps:
            - name: Deploy (placeholder - hosting provider TBD)
              run: |
                  echo "Environment: production"
                  echo "No hosting provider selected yet."
                  echo "stage deploy completed for portfolio/blog/quiz/news (per-app S3 + CloudFront)."
                  echo "Replace this job with a real prod promotion once envs/prod exists."
