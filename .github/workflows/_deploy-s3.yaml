name: Deploy site artifacts to S3 + CloudFront

on:
    workflow_call:
        inputs:
            environment:
                description: GitHub Environment name (test, stage, production). Selects OIDC role, buckets, and artifact suffix.
                required: true
                type: string

jobs:
    deploy-portfolio:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download portfolio artifact
              uses: actions/download-artifact@v8
              with:
                  name: portfolio-dist-${{ inputs.environment }}
                  path: _site/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Sync to S3
              run: aws s3 sync _site/ "s3://${{ vars.PORTFOLIO_S3_BUCKET_NAME }}" --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id "${{ vars.PORTFOLIO_CLOUDFRONT_DISTRIBUTION_ID }}" \
                    --paths "/*"

    deploy-blog:
