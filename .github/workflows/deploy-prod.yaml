name: Deploy PRODUCTION (AWS S3 + CloudFront)

on:
    workflow_dispatch:
        inputs:
            portfolio:
                description: Build and deploy portfolio-site
                type: boolean
                default: true
            blog:
                description: Build and deploy blog-site
                type: boolean
                default: true
            quiz:
                description: Build and deploy quiz-web-app
                type: boolean
                default: true
            news:
                description: Build and deploy news-feed-site
                type: boolean
                default: true

concurrency:
    group: deploy-prod
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    # Single human gate before any production build/deploy.
    # Configure Required reviewers on the GitHub Environment named
    # `production-approval` (Settings -> Environments). Using a dedicated
    # approval environment avoids re-prompting for each deploy-* job
    # (those still use `production` for OIDC + deploy vars).
    approve-prod:
        runs-on: ubuntu-latest
        timeout-minutes: 1440
        environment: production-approval
        steps:
            - name: Production approval gate
              run: echo "Human approval received for production deploy."

    # Reusable workflow jobs cannot set `environment:` on the caller job in a
    # way that exposes env vars to `_build-site.yaml`, so production CF tokens
    # are read here and passed as inputs. STAGE/TEST/DEV callers omit tokens.
    read-prod-cf-beacon-tokens:
        needs: approve-prod
        runs-on: ubuntu-latest
        environment: production
        outputs:
            portfolio: ${{ vars.CF_BEACON_TOKEN_PORTFOLIO }}
            blog: ${{ vars.CF_BEACON_TOKEN_BLOG }}
            news: ${{ vars.CF_BEACON_TOKEN_NEWS }}
            quiz: ${{ vars.CF_BEACON_TOKEN_QUIZ }}
        steps:
            - name: Read Cloudflare Web Analytics tokens
              run: echo "Passing production CF beacon tokens into the prod build (empty if unset)."

    build-site:
        needs: read-prod-cf-beacon-tokens
        uses: ./.github/workflows/_build-site.yaml
        with:
            environment: production
            portfolio_url: https://paulserban.eu
            blog_url: https://blog.paulserban.eu
            quiz_url: https://quiz.paulserban.eu
            news_url: https://news-feed.paulserban.eu
            portfolio_base: /
            blog_base: /
            quiz_base: /
            news_base: /
            emit_merged_bundle: false
            artifact_retention_days: 14
            cf_beacon_token_portfolio: ${{ needs.read-prod-cf-beacon-tokens.outputs.portfolio }}
            cf_beacon_token_blog: ${{ needs.read-prod-cf-beacon-tokens.outputs.blog }}
            cf_beacon_token_news: ${{ needs.read-prod-cf-beacon-tokens.outputs.news }}
            cf_beacon_token_quiz: ${{ needs.read-prod-cf-beacon-tokens.outputs.quiz }}
            s3_deploy: true
            portfolio: ${{ inputs.portfolio }}
            blog: ${{ inputs.blog }}
            quiz: ${{ inputs.quiz }}
            news: ${{ inputs.news }}
        secrets: inherit
        permissions:
            contents: read
            id-token: write
